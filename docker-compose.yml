version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: amanah-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: amanah
      POSTGRES_PASSWORD: amanah_dev
      POSTGRES_DB: amanah
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    container_name: amanah-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://amanah:amanah_dev@postgres:5432/amanah
      JWT_SECRET: change-me-in-production
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CORS_ORIGIN: "*"
      PORT: 3001
    depends_on:
      - postgres

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    container_name: amanah-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: /api
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: amanah-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

volumes:
  postgres-data: