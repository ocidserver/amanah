services:
  postgres:
    image: postgres:16-alpine
    container_name: amanah-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: amanah
      POSTGRES_PASSWORD: ${DB_PASSWORD:-amanah_dev}
      POSTGRES_DB: amanah
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amanah"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
    container_name: amanah-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://amanah:${DB_PASSWORD:-amanah_dev}@postgres:5432/amanah
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PORT: 3001
      APP_URL: ${APP_URL:-https://amanah.app}
      ENABLE_CRON: ${ENABLE_CRON:-false}
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    container_name: amanah-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: amanah-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads-data:/app/uploads:ro
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  uploads-data:
